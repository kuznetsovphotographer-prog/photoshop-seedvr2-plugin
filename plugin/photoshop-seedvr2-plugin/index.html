<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SeedVR2 Upscaler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ps-window-frame">
      <header class="panel-titlebar">
        <div class="panel-titlegroup">
          <span class="panel-mark" aria-hidden="true"></span>
          <span class="panel-title">SEEDVR2</span>
        </div>
        <div class="panel-title-actions">
          <div class="engine-action">
            <button id="preloadModelBtn" class="action-hitbox" type="button" aria-label="Preload SeedVR2 model" title="Preload SeedVR2 into memory"></button>
            <span class="button-visual engine-action-visual" aria-hidden="true">
              <svg class="engine-icon" viewBox="0 0 16 16"><path d="M8 2v8m-3-3 3 3 3-3M3 10v3h10v-3"/></svg>
            </span>
          </div>
          <div class="engine-action">
            <button id="unloadModelBtn" class="action-hitbox" type="button" aria-label="Unload SeedVR2 model" title="Unload SeedVR2 and free shared ComfyUI memory"></button>
            <span class="button-visual engine-action-visual" aria-hidden="true">
              <svg class="engine-icon" viewBox="0 0 16 16"><path d="M8 10V2M5 5l3-3 3 3M3 10v3h10v-3"/></svg>
            </span>
          </div>
        </div>
      </header>

      <div class="panel-content">
        <section class="intro-row">
          <div class="intro-copy">
            <h1>SeedVR2 Upscaler</h1>
            <p id="engineSubtitle">Super-resolution AI Engine</p>
          </div>

          <div class="action-button-wrap">
            <div class="action-surface">
              <button id="upscaleBtn" class="action-hitbox" type="button" aria-label="Upscale"></button>
              <span class="button-visual">
                <svg id="upscaleIcon" class="upscale-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.3 9.5v2.2c0 .55.45 1 1 1h7.4c.55 0 1-.45 1-1V9.5"></path>
                  <path d="M8.2 8.1 12.5 3.8"></path>
                  <path d="M9.2 3.8h3.3v3.3"></path>
                  <path d="M5.1 3.2v2.1"></path>
                  <path d="M4.05 4.25h2.1"></path>
                </svg>
                <svg id="busyIcon" class="busy-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 3a9 9 0 0 1 9 9"></path>
                </svg>
                <span id="upscaleLabel">Upscale</span>
              </span>
            </div>
          </div>
        </section>

        <section class="engine-row" aria-label="ComfyUI engine">
          <div class="engine-state">
            <span id="engineDot" class="engine-dot" aria-hidden="true"></span>
            <span id="engineStatus" role="status" aria-live="polite">ComfyUI · starts on demand</span>
          </div>
        </section>

        <section class="mode-section">
          <div id="scaleModeToggle" class="mode-heading" role="radio" aria-checked="true" tabindex="0">
            <div class="mode-labelgroup">
              <span class="radio-dot is-active" aria-hidden="true"></span>
              <span class="mode-label">Scale Multiplier</span>
            </div>
            <span class="mode-kind">BY FACTOR</span>
          </div>

          <div id="scaleButtons" class="scale-grid">
            <div class="choice-control">
              <button class="action-hitbox choice-hitbox is-active" type="button" data-factor="2" aria-label="2x" aria-pressed="true"></button>
              <span class="button-visual choice-visual" aria-hidden="true">2x</span>
            </div>
            <div class="choice-control">
              <button class="action-hitbox choice-hitbox" type="button" data-factor="3" aria-label="3x" aria-pressed="false"></button>
              <span class="button-visual choice-visual" aria-hidden="true">3x</span>
            </div>
            <div class="choice-control">
              <button class="action-hitbox choice-hitbox" type="button" data-factor="4" aria-label="4x" aria-pressed="false"></button>
              <span class="button-visual choice-visual" aria-hidden="true">4x</span>
            </div>
          </div>
        </section>

        <section class="mode-section">
          <div id="pixelsModeToggle" class="mode-heading" role="radio" aria-checked="false" tabindex="0">
            <div class="mode-labelgroup">
              <span class="radio-dot" aria-hidden="true"></span>
              <span class="mode-label">Shortest Side Limit</span>
            </div>
            <span class="mode-kind">EXACT PIXELS</span>
          </div>

          <div id="pixelsContainer" class="pixels-row is-disabled">
            <span class="pixels-label">Target Size:</span>
            <div class="pixels-editor">
              <span class="pixels-input-wrap">
                <textarea id="shortestSideInput" class="pixels-textarea-input" rows="1" inputmode="numeric" maxlength="4" aria-label="Shortest side pixels" spellcheck="false">2000</textarea>
              </span>
              <span class="pixels-unit">px</span>
            </div>
          </div>
        </section>

        <section class="output-section">
          <div class="output-card">
            <div class="output-copy">
              <span class="output-title">New Window</span>
              <span class="output-subtitle">Open output in a separate document</span>
            </div>
            <div id="newWindowToggle" class="new-window-toggle" role="switch" aria-checked="false" aria-label="New Window Off" tabindex="0">
              <span id="newWindowState" class="new-window-state">OFF</span>
              <span class="switch-track" aria-hidden="true">
                <span class="switch-thumb"></span>
              </span>
            </div>
          </div>
        </section>
        <section class="tiled-section">
          <div class="tiled-heading">
            <span class="output-title">Tiled Upscale</span>
            <div id="tiledToggle" class="new-window-toggle" role="switch" aria-checked="false" aria-label="Tiled Upscale Off" tabindex="0">
              <span id="tiledState" class="new-window-state">OFF</span>
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            </div>
          </div>
          <div id="tileButtons" class="scale-grid is-disabled">
            <div class="choice-control">
              <button class="action-hitbox choice-hitbox tile-button" type="button" data-parts="2" aria-label="2 parts" aria-pressed="false"></button>
              <span class="button-visual choice-visual" aria-hidden="true">2 parts</span>
            </div>
            <div class="choice-control">
              <button class="action-hitbox choice-hitbox tile-button" type="button" data-parts="4" aria-label="4 parts" aria-pressed="false"></button>
              <span class="button-visual choice-visual" aria-hidden="true">4 parts</span>
            </div>
            <div class="choice-control">
              <button class="action-hitbox choice-hitbox tile-button" type="button" data-parts="6" aria-label="6 parts" aria-pressed="false"></button>
              <span class="button-visual choice-visual" aria-hidden="true">6 parts</span>
            </div>
          </div>
          <p id="tilePreview" class="tile-preview">Process and blend image parts</p>
        </section>
      </div>

      <div id="progressStatus" class="progress-status" role="status" aria-live="polite" hidden></div>
      <button id="openLastResultBtn" class="scale-button recovery-button" type="button" hidden>Open Last Result</button>
      <div id="loaderProgress" class="loader-progress" aria-hidden="true"></div>
    </main>

    <script src="src/logger.js"></script>
    <script src="src/settings.js"></script>
    <script src="src/imageSizing.js"></script>
    <script src="src/tileLayout.js"></script>
    <script src="src/tileBlending.js"></script>
    <script src="src/workflowMapper.js"></script>
    <script src="src/comfyClient.js"></script>
    <script src="src/comfyEngine.js"></script>
    <script src="src/photoshop.js"></script>
    <script src="src/tiledUpscale.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
